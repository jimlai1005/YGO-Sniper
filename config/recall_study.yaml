  - {label: old-m-psa-3ki,     group: old, source: buyee_mercari, keyword: "遊戯王 PSA 三期"}
  - {label: old-y-psa-shoki,   group: old, source: yahoo_direct,  keyword: "遊戯王 PSA 初期"}
  - {label: old-y-psa-relief,  group: old, source: yahoo_direct,  keyword: "遊戯王 PSA レリーフ"}
  - {label: old-y-ars-shoki,   group: old, source: yahoo_direct,  keyword: "遊戯王 ARS 鑑定 初期"}
  - {label: old-y-bandai,      group: old, source: yahoo_direct,  keyword: "遊戯王 バンダイ 鑑定"}
  - {label: old-y-psa-3ki,     group: old, source: yahoo_direct,  keyword: "遊戯王 PSA 三期"}
  - {label: old-p-psa-shoki,   group: old, source: paypay_direct, keyword: "遊戯王 PSA 初期"}
  - {label: old-p-psa-relief,  group: old, source: paypay_direct, keyword: "遊戯王 PSA レリーフ"}
  - {label: old-p-ars-shoki,   group: old, source: paypay_direct, keyword: "遊戯王 ARS 鑑定 初期"}
  - {label: old-p-bandai,      group: old, source: paypay_direct, keyword: "遊戯王 バンダイ 鑑定"}
