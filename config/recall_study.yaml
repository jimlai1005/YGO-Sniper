# ---------------------------------------------------------------------------
# 召回率研究：**舊組合 vs 新組合**的前後對照（`ygo-sniper recall-study`）。
#
# 這不是掃描設定——pipeline 不會讀它。它是量尺：改 watchlist 的 queries 之前
# （或之後想驗收）跑一次，同一個時間窗內把兩組都打一遍，直接比聯集候選數與
# 請求數。分開兩次跑會落在不同時間窗，而市場每分鐘都在變（新着排序尤其），
# 那樣比出來的差異有一半是時間造成的。
#
# 三份研究設定各有分工（都可以重跑，結果覆寫到 reports/）：
#   config/recall_study.yaml  ← 本檔。舊組合 vs 分類版候選（reports/recall-20260803-final.json）
#   config/recall_round2.yaml   探勘：弱關鍵字強度、PayPay 品牌 vs 分類（…-r2.json）
#   config/recall_round4.yaml   **合併評估**：另一條線的純關鍵字查詢 × 分類版候選
#                               放在同一個時間窗算聯合邊際貢獻（…-joint.json）。
#                               最終落到 watchlist 的 12 條就是從那一份選出來的。
# ⚠️ 本檔的 `new` 組是**探勘用的候選集**，不等於最後落到 watchlist 的那 12 條
#   （最終組合含另一條線的 `PSA 1999`／`遊戯王 PSA 2期`，那兩條在 round4 才量到）。
#
# category 是**已解析好的分類值**（不是 watchlist 的別名），逐站不同：
#   buyee_mercari  1152        = 遊戯王OCG（Buyee 自己的分類樹）
#   yahoo_direct   2084005059  = 遊戯王（コナミ）
#                  ← 2026-08-03 由分類 facet 逐層實測：
#                    25464 おもちゃ、ゲーム → 27727 ゲーム
#                    → 25826 トレーディングカードゲーム → 2084005059（131/132 件）
#   paypay_direct  brand:167476 = 遊戯王OCG **品牌**
#                  ← `categoryIds=2511,2420`（トレーディングカード）不是遊戲王
#                    專屬的：實測那組結果有 31-50/100 筆是ポケモン／ワンピース。
#   ebay           省略 = 用 sources/ebay.py 的預設 183454（Yu-Gi-Oh! 個卡）
# ---------------------------------------------------------------------------
variants:
  # === old：2026-08-03 之前 watchlist 真的在跑的組合（5 條 × 3 來源 ＋ 2 條 eBay）
  - {label: old-m-psa-shoki,   group: old, source: buyee_mercari, keyword: "遊戯王 PSA 初期"}
  - {label: old-m-psa-relief,  group: old, source: buyee_mercari, keyword: "遊戯王 PSA レリーフ"}
