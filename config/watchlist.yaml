# ---------------------------------------------------------------------------
# 要掃什麼。這是你之後最常改的檔案。
# ---------------------------------------------------------------------------

# 每天實際送出的搜尋。keyword 會直接進 Yahoo / Buyee / eBay 的搜尋框。
# sources 是「發現管道名」（registry 的鍵，見 sources/__init__.py）：
#   yahoo_direct＝Yahoo 拍賣直抓（主力，不需瀏覽器）；
#   paypay_direct＝Yahoo!フリマ 原站直抓（純 httpx，一頁 100 筆）；
#   buyee_mercari＝Buyee 搜尋頁（唯一還需要 WafSession／Playwright 的一條）。
# max_price_jpy 留空的話，程式會用 `ygo-sniper breakeven` 算出來的
# 「到手成本 = 鑑定費」對應金額自動填入，等於幫你先砍掉不可能中的標的。
#
# 2026-08-02：PayPay 由 buyee_paypay（Buyee 鏡像）改成 paypay_direct（原站直抓）。
# 實測同關鍵字：直抓 100 筆/頁、0.86s、純 httpx；走 Buyee 40 筆/頁、2.66s、
# 要開瀏覽器解 WAF；價格逐筆相同。購買路徑沒變（Listing.url 仍是 Buyee 連結），
# 所以成本模型與去重鍵零修改。scoring／valuation 一律不知道有這回事。
# 附帶效果：paypay_direct 的 supports_sold=True，所以上面這幾條查詢會**自動**
# 多跑一輪「已售出」搜尋餵 comps（見 comps.sold_queries），而且那批樣本帶的是
# **真實成交時間**（原站的 endTime），不是入庫時間。
#
# 2026-08-03（第二階段，分類 ID）：原本的五條「遊戯王 …」全部收掉／改寫。
# 同一個事故的另一半解法——**用分類 ID 保證「這是遊戲王」，關鍵字只負責
# 「這是鑑定卡」**。`category:` 是別名，逐來源在下面的 `categories:` 表查值
# （各站編號系統完全無關，見 src/ygo_sniper/queries.py）。
#
# ⚠️ 分類 ID 從 2026-08 之前就寫在 `categories:` 裡，但**從來沒有生效過**：
# `pipeline.run_source_search` 只把它傳給「沒有 search_detailed 的舊介面」，
# 而 Buyee 有 search_detailed → 每一輪都在 `**kwargs` 那一行被安靜丟掉。
# 症狀是零——「分類沒生效」與「分類生效了但今天貨就長這樣」外顯一模一樣。
#
# 實測（`ygo-sniper recall-study`，同一時間窗、各 1 頁、帶生產價格上限；
# 報告 reports/recall-20260803-{final,joint}.json）：
#   舊五條 ×3 來源 ＋ 舊 2 條 eBay ＝ 17 請求 → 聯集 **146** 個候選
#   現在這 12 條                  ＝ 19 請求 → 聯集 **263**（同一份 266 的母體）
# 單條最大變化：Mercari `遊戯王 PSA 初期` 8 個候選 →「PSA 初期」＋分類 1152
# 得 **36** 個（兩者交集只有 5）。新撈到的長這樣：
#   `PSA9 ダンシング・エルフ UR 初期 PREMIUM PACK 1999 B-1156`
#   `【 鑑定品 PSA9 】 双頭の雷龍 初期 ウルトラ`
# ——與使用者買的那兩張同一個形狀：**標題裡沒有「遊戯王」**。
#
# 被砍掉的（每條都附實測理由，砍法與加法用同一把尺）：
#   `遊戯王 PSA レリーフ` ×3  → 分類版只剩 4 個候選、組內邊際 1。預算不夠時
#       它是**第一個該加回來的**（レリーフ 是稀有度溢價最高的一段 ×4.7）。
#   `遊戯王 ARS 鑑定 初期` ×3 → 由 `ARS 初期`＋分類 ×2 取代（候選 7→7／12→13，
#       少一個請求）。
#   `遊戯王 バンダイ 鑑定` ×3 → 分類版 Yahoo 12 個候選但組內邊際 0（全被
#       `PSA 初期`＋分類蓋掉）；mercari/paypay 實測 0 個候選。
#   `遊戯王 PSA 三期` mercari/paypay → 兩邊都 0 個候選。Yahoo 保留（分類版 17）。
#
# ⚠️ 分類過濾也會**靜默漏掉**東西（賣家把遊戲王卡掛在別的分類）：實測舊的
#   `遊戯王 PSA 初期`（無分類）有 3 筆不在分類 1152 裡。所以下面留了一條無分類
#   的保險 query——**一個請求換一種不同的失敗模式**，分類壞掉（改編號、分錯類）
#   與關鍵字壞掉（標題沒寫廠牌）不會同時發生。
#
# ❌ 試過但不採用：**純分類瀏覽**（不帶關鍵字）。
#   - Yahoo 的 `search/search?auccat=…` 不帶 `p=` 回 0 bytes；改用
#     `category/list/2084005059/`（既有 selector 直接可解、一頁 100 筆、
#     `s1=new&o1=d` 有效）實測 **100 筆裡只有 1 個候選**，而整個分類有 26.5 萬件。
#   - Buyee Mercari 空關鍵字＋分類 1152：96 筆 **0 個候選**；分類 82 更差。
#   - PayPay `brandIds=167476` 空關鍵字：95 筆 **0 個候選**。
#   - eBay 空關鍵字＋分類 183454：90 筆 **0 個候選**（Browse API 是 `sort=price`
#     升冪，第 1 頁必然是最便宜的現代卡）。
#   共同原因：新着排序下的第 1 頁只是「整個分類最近幾分鐘的上架」，而我們要的
#   1998-2004 鑑定卡在分類裡是千分之一量級。要靠純瀏覽補齊得翻幾十頁，
#   那是每輪數十個請求換個位數候選——同樣的請求給關鍵字查詢可以換到數十個。
queries:
  # --- 主力：分類保證卡種，關鍵字只管「鑑定＋年代」---------------------
  # 候選數（2026-08-03 實測）：Mercari 36／Yahoo 25／PayPay 5，組內邊際 30。
  - name: "PSA 初期（分類）"
    keyword: "PSA 初期"
    category: yugioh
    sources: [yahoo_direct, buyee_mercari, paypay_direct]

  # 保險：不帶分類的舊查詢。**留著是因為分類過濾也會靜默漏東西**——賣家把
  # 遊戲王卡掛在別的分類時，上面每一條都看不到它。實測（同一時間窗）舊的
  # 這條在 Mercari 撈到 3 筆不在分類 1152 裡的候選（組內邊際 3）。
  # 一個請求換一種**不同的失敗模式**：分類壞掉（改編號、賣家分錯）與關鍵字
  # 壞掉（標題沒寫廠牌）不會同時發生。
  #
  # 三個平台都掛，不是照抄三件套：它是「遊戯王 …」開頭的寬查詢，而
  # tests/test_source_pages.py 的
  # `test_broad_japanese_queries_still_cover_all_three_platforms` 把
  # 「寬查詢三平台全跑」釘成不變式。Yahoo／PayPay 這兩趟今天各只多帶 1／0 筆
  # （分類版已經涵蓋 25/26、2⊂5），但它們扛的是同一個保險角色，
  # 而為了省 2 個請求破掉不變式，換來的是每次改設定都要重新論證一次覆蓋面。
  - name: "PSA 初期（無分類保險）"
    keyword: "遊戯王 PSA 初期"
    sources: [yahoo_direct, buyee_mercari, paypay_direct]

  # Mercari 7／Yahoo 13。取代 `遊戯王 ARS 鑑定 初期`（同樣的貨、少一個請求）。
  - name: "ARS 初期（分類）"
    keyword: "ARS 初期"
    category: yugioh
    sources: [yahoo_direct, buyee_mercari]

  # Yahoo 17。mercari/paypay 的三期實測 0 個候選，不排。
  - name: "PSA 三期（分類）"
    keyword: "PSA 三期"
    category: yugioh
    sources: [yahoo_direct]

  # -------------------------------------------------------------------------
  # 2026-08-03 新增三條。**事故驅動**：使用者自己在 Mercari 找到並買了
  #   `【PSA9】カエルスライム 初期 プレミアムパック`
  #   `【PSA9】大砲だるま 初期 プレミアムパック`
  # 兩張，dashboard 從來沒出現過。根因不是解析（兩個標題跑 parse_card 都得到
  # `jp_kw:初期`＋PSA9＋is_candidate=True），而是**搜尋詞**：上面五條每一條都
  # 以「遊戯王」開頭，而 Mercari／PayPay 的搜尋是 AND 語意——標題裡沒寫
  # 「遊戯王」三個字的標的，我們從來沒送出過能命中它的查詢。
  #
  # 實測（2026-08-03，各來源第 1 頁、帶生產的價格上限 max_price=8,445 日圓；
  # 「淨增量」＝該查詢的候選扣掉上面五條的候選聯集後還剩幾筆）：
  #
  #   查詢                      mercari  yahoo  paypay   合計淨增
  #   PSA 1999                    +26      +1     +3      +30
  #   遊戯王 PSA 2期               +13      +3      0      +16
  #   遊戯王 PSA ブースター          +12       0     +1      +13
  #   PSA 初期 プレミアムパック         +4       0      0       +4
  #   遊戯王 PSA Vol               +4       —      —       +4
  #   遊戯王 PSA 2000              +3       —      —       +3
  #   PSA 初期／PSA 鑑定 初期／鑑定品 初期／ARS 初期／PSA レリーフ  全部 0 或全是雜訊
  #
  # 三條刻意的取捨：
  # 1. **不帶「遊戯王」的窄查詢只掛有量到淨增量的來源**：`PSA 初期
  #    プレミアムパック` 在 yahoo／paypay 實測淨增 0，就只掛 mercari。
  #    （「遊戯王 …」開頭的寬查詢不適用這條，它們一律三個平台都跑。）
  # 2. `PSA 初期 プレミアムパック` 的淨增量只有 +4，但它是**唯一**能命中
  #    「標題沒有遊戯王、也沒有年份」那個形狀的查詢，也就是使用者實際買到的
  #    那兩張的標題形狀。貪婪選集會說它邊際 0（今天的快照裡被 PSA 1999 蓋掉），
  #    但那是快照假象——留著它是為了那個**類別**，不是為了今天這幾筆。
  # 3. `遊戯王 PSA ブースター`（+13）落選只是因為預算上限 8 條。要放寬到 9 條時
  #    它是下一個該加的，優先於任何其他候選。
  #
  # ⚠️ 已知副作用：`PSA 1999` 拿掉了「遊戯王」，所以會撈進別的卡種
  #    （實測 mercari 26 筆淨增裡有 7 筆是棒球／足球卡：Calbee 松坂大輔、
  #    イチロー、中田英寿；paypay 3 筆裡 1 筆是 NBA 的 Vince Carter）。
  #    **刻意不加「看起來像遊戲王」的守門**：`cards.looks_like_yugioh` 只認
  #    遊戯王／遊戲王／yugioh 三個字串，實測會連現有五條查詢自己撈到的 5 筆
  #    真遊戲王卡一起殺掉（`ブラックマジシャンガール 初期 ウルトラ P4-01`、
  #    `双頭の雷龍 初期 ウルトラ`、`クレセントドラゴン 初期 psa9` …）——
  #    那正是本次要救的那一類標的。寧可讓人一眼略過幾張棒球卡，
  #    也不要用一個會誤殺目標的守門把問題藏起來。
  # -------------------------------------------------------------------------
  - name: "PSA 1999（不帶遊戯王）"
    keyword: "PSA 1999"
    sources: [yahoo_direct, buyee_mercari, paypay_direct]

  # paypay_direct 今天實測淨增 0，仍然掛著：它是「遊戯王 …」開頭的寬查詢，
  # 而寬查詢三個平台都要跑是本專案的不變式（tests/test_source_pages.py 釘住）。
  # 為了省一個請求破掉不變式，換來的是每次改設定都要重新論證一次覆蓋面。
  - name: "PSA 2期"
    keyword: "遊戯王 PSA 2期"
    sources: [yahoo_direct, buyee_mercari, paypay_direct]

  - name: "PSA 初期 プレミアムパック（不帶遊戯王）"
    keyword: "PSA 初期 プレミアムパック"
    sources: [buyee_mercari]

  # --- eBay：拼法就是覆蓋率 ------------------------------------------------
  # 2026-08-03 實測（各 1 頁、同一時間窗）：四種拼法帶回明顯不同的東西，
  # 而且**每條只花一個請求**——這是全表投報率最高的四條。
  #   yugioh PSA LOB 1st edition   95 候選（組內邊際 25）
  #   yu-gi-oh PSA 1st edition     41 候選（組內邊際 31）← 邊際最高的單條
  #   yu-gi-oh PSA LOB             90 候選（組內邊際 20）
  #   Yu-Gi-Oh! PSA graded vintage  5 候選（組內邊際 5）
  #   yugioh graded PSA 2002 2003   2 候選（組內邊際 2，原有的那條）
  # 「yugioh」與「yu-gi-oh」不是同義詞：`yugioh PSA LOB` 與 `yu-gi-oh PSA LOB`
  # 各有 25／20 筆是對方沒有的（交集 70）。eBay 的搜尋不做這種正規化。
  # ⚠️ 廣泛關鍵字在 eBay 完全無效（`PSA`／`graded`／空字串各 100 筆、**0 候選**）：
  # Browse API 用 `sort=price` 升冪，廣查詢的第 1 頁就是最便宜的現代卡。
  - name: "eBay LOB/SDK graded"
    keyword: "yugioh PSA LOB 1st edition"
    sources: [ebay]

  - name: "eBay 1st edition（連字號拼法）"
    keyword: "yu-gi-oh PSA 1st edition"
    sources: [ebay]

  - name: "eBay LOB（連字號拼法）"
    keyword: "yu-gi-oh PSA LOB"
    sources: [ebay]

  - name: "eBay vintage graded（驚嘆號拼法）"
    keyword: "Yu-Gi-Oh! PSA graded vintage"
    sources: [ebay]

  - name: "eBay vintage graded"
    keyword: "yugioh graded PSA 2002 2003"
    sources: [ebay]

# ---------------------------------------------------------------------------
# 行情累積專用的「已售出」查詢（comps）。**與上面的 queries 是兩件事**：
# queries 掃在架標的（要新、要快、每小時跑）；這裡累積成交價（要廣、要涵蓋
# 整個屬性空間、一天跑一兩次就好）。
#
# 為什麼要組合展開：實測 170 筆可用樣本散在 159 個桶（平均 1.07 筆/桶），
# 統計上等於沒有行情——絕大多數訊號只能報「無足夠樣本」。分桶的維度是
# 「稀有度 × 年代 × 機構 × 分數」，查詢就得照同一組維度展開，才可能每個桶
# 都拿到樣本。
#
# 請求預算（這是硬約束，改之前先算一次）：
#   comps_queries 展開出的查詢數 = len(eras) × len(rarities) × len(graders) + len(extra)
#          = 6 × 6 × 2 + 6 = 78（上限 max_queries 會截斷）。
#   CompsEngine.sold_queries() 還會併入 queries 區塊裡支援 sold 的來源
#   （buyee_mercari／paypay_direct，約 10 條），實測總量 88 條——改任一邊
#   都要重新實測這個數字，不要用 78 心算分片大小。
#
#   分片語意（2026-08-11 起，取代舊的「每 N 輪跑一次全量」）：
#   `CompsEngine.sold_shard` 每輪只跑 ceil(總數 / every_n_runs) 條，游標
#   跨行程記在 store，every_n_runs 輪走完一整份。88 ÷ 12 → 每輪 8 條
#   （ceil(88/12)=8），走完一整份要 ceil(88/8)=11 輪，不是 12——分片是
#   無條件進位，除不盡時實際輪數會比 every_n_runs 少。
#   每輪請求數 ≈ 8 條 × 實際頁數（≤4）＝ 最多 32 個請求，取代舊制「第 12 輪
#   一次全跑」的尖峰（≈ 200-250 請求擠在一輪）。
comps_queries:
  # 12 輪（≈ 11 輪，見上）走完一整份查詢清單，每輪只跑其中一小片
  # （CompsEngine.sold_shard，見上方請求預算）。
  # 行情是以「週」為單位在變的，每小時重抓一次落札相場只會拿到同一批資料，
  # 分片把總請求量攤平成穩定小流量，而不是每 N 輪打一次尖峰。
  # 設 1 = 每輪都跑全量（只建議在手動除錯時用）。
  every_n_runs: 12
  # 每個已售出查詢翻幾頁（每頁 50 筆）。與 settings.yaml 的
  # fetch.max_pages_per_query（在架掃描用，= 1）刻意分開：
  # 在架掃描每小時跑、翻頁只會重複拿到上一輪看過的東西；
  # Yahoo 落札相場的視窗有 180 天，翻頁是在挖存量，每頁都是新資料。
  #
  # 為什麼是 4：實測 `遊戯王 初期 ウルトラ PSA`（pool 317）逐頁的成交日期——
  #   p1 6/25-8/1（可用 45）｜p2 5/26-6/23（40）｜p3 4/12-5/26（34）
  #   ｜p4 之後全部落在 90 天視窗外（存得下，但 load_comps 不會取用）
  # 也就是說高流量查詢大約 3 頁就把 90 天視窗挖完，第 4 頁是留給流量更大的
  # 查詢的邊際。再往下翻只是在囤 90 天外的資料——真要用得先加大
  # settings.yaml 的 scoring.comps_window_days，那是另一個決定。
  # 冷門查詢（pool < 50）不滿一頁就停，不會付這個成本。
  pages: 4
  # 展開後的查詢數硬上限，超過就截斷尾端並印警告（防組合爆炸）
  max_queries: 120
  # 哪些發現管道要跑這組查詢。必須明列——展開後有數十個關鍵字，
  # 自動套用到每一條管道會讓請求數直接乘上管道數。
  # yahoo_closed = Yahoo 落札相場（closedsearch），純 httpx、有真實成交價。
  # buyee_mercari 的 sold_out 搜尋要 Playwright 解 WAF、且**頁面上沒有任何成交
  # 時間**（2026-08-02 實測，搜尋頁與商品頁都沒有），paypay_direct 的已售出
  # 產出率又低——兩者都已經透過上面的 queries 跑到了，不必再吃這組展開。
  sources: [yahoo_closed]
  # 組合模板。空的維度會自動收掉多餘空白。
  template: "遊戯王 {era} {rarity} {grader}"
  # 年代詞（同時也是 era_markers 的關鍵字 → 命中的標題自然帶年代證據，
  # 這是 keep 率的主要來源：實測「初期」系列 42-48/50，無年代詞的只有個位數）
  eras: ["初期", "二期", "三期", "Vol", "旧アジア", "旧テキスト"]
  # 稀有度詞（對應 parsers/rarity.py 的封閉詞表，分桶維度之一）
  rarities: ["レリーフ", "アルティメット", "シークレット", "ウルトラ", "スーパー", "パラレル"]
  # 鑑定機構（accepted_graders 只收這兩家）
  graders: ["PSA", "ARS"]
  # 不參與組合、直接送出的補充查詢。2026-08-01 實測 keep 率：
  #   遊戯王 初期 PSA 44/50、遊戯王 ARS 鑑定 初期 45/50、
  #   遊戯王 PSA 10 初期 40/50、遊戯王 バンダイ 鑑定 30/34、遊戯王 旧アジア PSA 30/32
  extra:
    - "遊戯王 初期 PSA"
    - "遊戯王 ARS 鑑定 初期"
    - "遊戯王 PSA 10 初期"
    - "遊戯王 バンダイ 鑑定"
    - "遊戯王 旧アジア PSA"
    - "遊戯王 旧レリーフ PSA"

# ---------------------------------------------------------------------------
# 需求驅動的行情回補（refill.py）。**與上面的 comps_queries 互相獨立**：
# comps_queries 是廣撒（屬性組合展開，撈熱門卡，一天 1-2 次）；這裡是點射——
# 從掃到的競標標的反推「哪張卡等著行情但庫裡同卡成交不足」，用該卡的日文卡名
# 對已售出來源做針對性查詢。每輪掃描都會跑（量小且有自己的節流），
# 手動觸發：`ygo-sniper refill-comps`（--dry-run 只看會選誰）。
# ---------------------------------------------------------------------------
refill:
  # 同卡成交少於幾筆才算「缺樣本」（門檻對齊出價閘門要的 L1/L2：至少要有
  # 同卡成交才有出價上限；3 = 留一點餘裕，不是剛好 1 筆就收手）
  min_comps: 3
  # 每輪最多回補幾張卡。請求數 ≈ 卡數 × 來源數（每卡每來源固定 1 頁），
  # 10 × 3 = 30 個請求、間隔 2 秒 ≈ 1 分鐘——這是硬預算，調大前先算一次。
  max_cards_per_run: 10
  # 同一張卡回補後幾天內不重查。查過還是 0 筆代表市場上就是沒有近期成交，
  # 短期重查只是浪費請求（查無結果也會記帳，就是為了讓這條冷卻生效）。
  cooldown_days: 7
  # 已售出來源（依序查）。yahoo_closed 為主（結標成交、真實時間、純 httpx）；
  # paypay_direct 產出率低但時間是真的；buyee_mercari 要 Playwright 解 WAF
  # 且頁面沒有成交時間（價格是真的，sold_at 會標成入庫時間）。
  sources: [yahoo_closed, paypay_direct, buyee_mercari]

# ---------------------------------------------------------------------------
# 分類 ID：`queries[].category` 寫**別名**，這張表逐來源查值。
#
# 為什麼要兩層：各站的分類編號系統毫無關係（Buyee 的 1152 與 Yahoo 的
# 2084005059 不是同一棵樹的兩個節點，是兩棵樹），而一條 query 會同時送到
# 好幾個來源。把值直接寫在 query 上就只能服務一個來源。
#
# 某來源沒有這個別名 → 那條 query 對它退化成純關鍵字搜尋（**不是錯誤**：
# 各站分類樹不對齊是事實，硬要求每站都填會逼人填假資料）。別名整張表都不存在
# 才印警告——那是打錯字。
#
# 值一律以字串流動，由各 source 轉成自己的參數（見各 source 的
# `supports_category` 註記）：Buyee `category_id`／Yahoo `auccat`／
# PayPay `categoryIds` 或 `brandIds`／eBay `category_ids`。
categories:
  buyee_mercari:
    # Buyee 自己的分類樹。1152 = 遊戯王OCG，82 = トレーディングカード（上一層）。
    yugioh: 1152
    yugioh_ocg: 1152
    trading_cards: 82
  yahoo_direct:
    # 2026-08-03 由分類 facet 逐層實測（「遊戯王 PSA 初期」的 132 件命中）：
    #   25464 おもちゃ、ゲーム → 27727 ゲーム → 25826 トレーディングカードゲーム
    #   → 2084005059 遊戯王（コナミ）  ← 131/132 件落在這一格
    # ⚠️ `search/search` 端點**必須帶關鍵字**：只給 auccat 不給 `p=` 回 0 bytes。
    #    純瀏覽要走 `category/list/{id}/`，那條路實測 100 筆只有 1 個候選，不採用。
    yugioh: 2084005059
    tcg: 25826
  paypay_direct:
    # ⚠️ 這裡用的是**品牌**不是分類（`brand:` 前綴 → `brandIds` 參數）。
    # 分類 `2511,2420`（ゲーム、おもちゃ／トレーディングカード）**不是遊戲王
    # 專屬的**：2026-08-03 實測那組結果有 31-50/100 筆是ポケモン／ワンピース。
    # 167476 = 遊戯王オフィシャルカードゲーム デュエルモンスターズ（84,620 件）。
    # 另外實測 `catId`／`categoryId`／`brandId`（單數）三個名字**全部被靜默忽略**
    # ——SSR 的 searchParams 完全不變，只有 `categoryIds`／`brandIds` 會進去。
    yugioh: "brand:167476"
    trading_cards: "category:2511,2420"
  ebay:
    # Yu-Gi-Oh! CCG Individual Cards。**留在這裡只是為了讓它可查**——
    # `sources/ebay.py` 沒帶 category 時就會用同一個值當預設（那條管道不帶分類
    # 等於搜整個 eBay），所以 eBay 的 query 不必寫 `category:`。
    yugioh: "183454"

# ---------------------------------------------------------------------------
# 年代判定：命中任一 marker 就算落在 1998-2004
# ---------------------------------------------------------------------------
era_markers:
  # 日版：時期／版式關鍵字
