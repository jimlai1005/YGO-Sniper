    # 「旧レリーフ」與上面兩個同構：レリーフ 本身只是稀有度（現代卡也有，
    # 所以不能當年代標記），但賣家特地寫「旧」就是在標示這是舊規格的那一批。
    # 實測：405 筆成交裡有 11 筆是這樣寫的真古董，移除 レリーフ 後被誤擋。
    - "旧レリーフ"
