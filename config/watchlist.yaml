  # ⚠️ 這裡只放**年代**標記，不放稀有度。`レリーフ` 與 `アルティメット` 曾誤放在此，
  # 造成 `レリーフ PSA8 CRMS-JP019`（2009）與 `PSA9 クリスタルウィング…アルティメット`
  # （2014）被判成 1998-2004 候選——現代卡一樣有アルティメットレア。
  # 稀有度改由 parsers/rarity.py 抽取，只當屬性、不當年代證據。
