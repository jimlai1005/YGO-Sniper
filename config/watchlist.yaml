# 命中任一就直接丟掉。這是 signal-to-noise 的關鍵，
# 因為現代高價卡的搜尋量會把 1998-2004 完全淹掉。
exclude_keywords:
  - "25th"
  # 20th ANNIVERSARY 系列（2016 年後）。⚠️ 這一條原本不在清單裡——只有 25th 在。
  # "20th" 是子字串比對，順帶蓋掉 20thSE / 20thシークレット，不必再列一次。
  - "20th"
  - "クオシク"
  - "クォーターセンチュリー"
  - "QCCP"
  - "QCLP"
  - "プリシク"
  # 2026-08-05：移除 "プリズマ" —— 它是 1998-2004 真卡「プリズマン」的子字串，
  # 而 "プリズマティック"（下一行）已經涵蓋它原本要擋的現代稀有度，完全冗餘。
  # 由 `ygo-sniper corpus-diff` 抓到（形狀同 スターカード ⊂ モンスターカード）。
  - "プリズマティック"
  # --- 現代確認詞：出現這些就一定不是 1998-2004 ---
  # ホログラフィック（ホロレア，2008 年後）／レアリティコレクション（2022-）／
  # DMMD（DUEL MONSTERS MASTER DUEL 聯動，2022-）。
  # 這三個常跟「初期絵」一起出現在現代復刻卡的標題上。
  - "ホログラフィック"
  - "レアリティコレクション"
  - "DMMD"
  - "アーコレ"
  - "ラッシュデュエル"
  - "RUSH DUEL"
  - "スタンプ"
  - "決闘者伝説"
  - "ANNIVERSARY"
  - "デッキパーツ"
  # --- 多卡整包。**一筆整包對區間寬度的傷害遠大於它的筆數** ---
  # 實例：`PSA10 遊戯王 青眼の白龍 ブラック・マジシャン 連番2枚セット 初期`
  # 成交 NT$451,111——它是「兩張卡的總價」，卻被當成一張卡的行情進了資料庫。
  # 「N枚セット」用子字串 "枚セット" 蓋（2枚/10枚 都命中），不用寫死數字。
  - "まとめ売り"
  - "枚セット"
  - "セット売り"
  - "重複"
  - "引退品"
  - "ポケモン"
  # 英文寫法要另外列：子字串比對是逐字的，「ポケモン」蓋不到 "POKEMON"。
  # 2026-08-04 事故（Seller Alpha 第三棒）：賣家頁列舉**沒有關鍵字**（問的是
  # 「這個賣家有什麼」），於是 `ebay:psa` 這種「什麼都鑑定什麼都賣」的賣家把
  # 1998 POKEMON BLUE VERSION / 2004 POKEMON POP SERIES 整批送進候選——
  # 年代對（1998-2004）、機構分數也對（PSA 9），判準完全沒有理由擋它。
  # 這個洞一直都在，只是關鍵字搜尋（q=yugioh）從來不會撈到寶可夢而看不見。
  # 雙向實測（卡名主檔 cards_1998_2004.json、comps 1,800 列、signals、
  # listing_obs）：POKEMON 命中 10 筆全是他卡種、ONE PIECE 命中 1 筆同樣是，
  # **真遊戲王誤殺 0**。
  - "POKEMON"
  - "ワンピース"
  - "ONE PIECE"
  - "デュエマ"
  - "リペア"
  - "自作"
  - "オリカ"
  - "非公式"
  - "ダミー"
  - "プロキシ"
  # --- 他卡種（2026-08-03，使用者回報「裡面有混一些球員卡，棒球跟籃球都有」）---
  # 根因：`PSA 1999` 那條查詢刻意不帶「遊戯王」（見上面 queries 的註記），
  # 代價就是撈進別的卡種。修法是**負面表列**：他卡種的品牌與聯盟名是有限集，
  # 而「看起來像遊戲王才收」的正面表列實測會誤殺 5 筆真古董卡（同上）。
  #
  # 每一個詞都跑過雙向實測才進來（腳本見本次 session；母體：卡名主檔 15,396 個
  # 卡名／套組名、comps 1,729 列、signals 342 列、cache 語料 15,557 個標題）：
  # 擋到的必須全是他卡種，真遊戲王卡誤殺必須是 0。
  #
  # ❌ 實測後**剔除**的候選（每個都會誤殺，留著當反例——不要憑印象加回去）：
  #   NBA        → 子字串命中卡名 `CANNONBALL SPEAR SHELLFISH`（CA-NBA-LL）
  #   BASEBALL   → 命中真卡 `ULTIMATE BASEBALL KID`
  #   サッカー     → 命中 5 張真卡（`ブラッド・サッカー`、`シャーク・サッカー` …）
  #   スターカード   → 是 `モンスターカード` 的子字串（實測誤殺 17 筆遊戯王標題）
  #   クラシック    → 遊戯王賣家自己在用（`遊戯王 マクロコスモス ウルトラ クラシック
  #                 旧テキスト`），且命中卡名 `ＥＭクラシックリボー`
  # 球員卡：品牌／製造商／聯盟
  - "カルビー"
  - "CALBEE"
  - "BBM"
  - "TOPPS"
  - "BOWMAN"
  - "PANINI"
  - "PRIZM"
  - "SKYBOX"
  - "FLEER"
  - "DONRUSS"
  - "UPPER DECK"
  - "MLB"
  - "NFL"
  - "プロ野球"
  - "Jリーグ"
  # 他 TCG（「ポケモン」「ワンピース」「デュエマ」在上面已經有了）
  - "デジモン"
  - "DIGIMON"
  - "デュエルマスターズ"
  - "デュエル・マスターズ"
  - "DUEL MASTERS"
  - "ヴァイスシュヴァルツ"
  - "バトルスピリッツ"
  - "ウィクロス"
  - "WIXOSS"
  - "MTG"

# 排除字第二層：**只在標題沒有「遊戯王／遊戲王／yugioh」字樣時**才生效。
# 機制見 parsers/card.py 的 `_hit_soft_keyword`。
#
# 這裡放的是「他卡種的行話，但遊戯王賣家偶爾也借用」的詞——無條件排除會誤殺，
# 完全不放又擋不掉他卡種。遊戯王字樣在這一層只用來**赦免**，不用來**錄取**
# （正面表列會誤殺標題沒寫廠牌的真古董卡，那正是本專案最想撈到的一類）。
#
# ⚠️ 往這裡加詞之前先問：「這個詞出現在**沒寫遊戯王**的真古董卡標題上的機率多高？」
#   高 → 不要加。這一層的誤殺對象正是本專案最珍貴的那批標的。
exclude_keywords_unless_yugioh:
  # デュエマ／MTG 的「舊卡框」行話。實測語料 11 筆命中：9 筆デュエマ、
  # 2 筆真遊戲王——而那 2 筆標題都寫了「遊戯王」，所以本層放行。
  - "旧枠"
  # 球員卡的「インサートカード」。實測在卡名主檔、comps、遊戯王標題語料裡
  # 各為 0 命中；唯一命中的是 `1999 DS France PSA 8 インサート 中田英寿`（足球）。
  - "インサート"

# 鑑定機構：只收這些
accepted_graders:
  - "PSA"
  - "ARS"

# 最低分數門檻。專注在鑑定後 7-10 分的區間：
# 7 分以下的鑑定卡流動性差、行情樣本稀薄，統計上不可靠。
min_grade:
  PSA: 7
  ARS: 7
